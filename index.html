<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizJS</title>
</head>
<body>
        <header class="header">
            <div class="container">
                <div class="header_wrapper">
                    <h1 class="header_title">QuizJS</h1>
                    <div class="header_timer">00:00</div>
                </div>
            </div>
        </header>
        <main>
            <div class="container">
                <section class="quiz">
                    <div class="quiz_question">
                        <h2>JavaScript is..?</h2>
                    </div>
                    <div class="quiz_answers">
                        <p>A</p>
                        <p>B</p>
                        <p>C</p>
                        <p>D</p>
                    </div>
                    <nav class="nav">
                        <button id="prev">Prev</button>
                        <button id="next">Next</button>
                    </nav>
                </section>
                <section class="progressBar">
                    <p>Progress...</p>
                </section>
            </div>
        </main>
        <footer class="footer">
            <div class="container">
                <p class="footer_text">Copyright © 2025, All Rights Reserved</p>
            </div>
        </footer>
    </div>
</body>
</html>
