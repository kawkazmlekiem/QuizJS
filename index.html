<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizJS</title>
</head>
<body>
        <header class="header">
            <div class="container">
                <div class="header_wrapper">
                    <h1 class="header_title">QuizJS</h1>
                    <div class="header_timer">00:00</div>
                </div>
            </div>
        </header>
        <main>
            <div class="container">
                <section class="quiz">
                    <form class="quiz_question">
                        <h2 id="question">Inside which HTML element do we put the JavaScript?</h2>
                        <div class="quiz_answers">
                            <label for="input-1">
                                <input type="radio" value="1" name="input-1">
                                &lt;script&gt;
                            </label>
                            <label for="input-2">
                                <input type="radio" value="2" name="input-2">
                                &lt;js&gt;
                            </label>
                            <label for="input-3">
                                <input type="radio" value="3" name="input-3">
                                &lt;javascript&gt;
                            </label>
                            <label for="input-4">
                                <input type="radio" value="4" name="input-4">
                                &lt;scripting&gt;
                            </label>
                        </div>
                    </form>
                    <nav class="nav">
                        <button id="prev" class="button--prev">Prev</button>
                        <button id="next" class="button">Next</button>
                    </nav>
                </section>
                <section class="progressBar">
                    <p>Progress...</p>
                </section>
            </div>
        </main>
        <footer class="footer">
            <div class="container">
                <p class="footer_text">Copyright © 2025, All Rights Reserved</p>
            </div>
        </footer>
    </div>
</body>
</html>
